<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        .card{
            width:80px;
            padding: 20px;
            margin: 20px;
            
        }
        .card-larga{
            grid-column: 3;
            grid-row: span 2;
           
            display: flex;
            flex-direction: column;
        }
    </style>    
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color: rgb(79, 29, 125);">CARS 1</div>
        <div class="card" style="background-color: rgb(5, 136, 107);">CARS 2</div>
        <div class="card-larga" style="background-color: rgb(136, 5, 5);">CARS 3</div>
        <div class="card" style="background-color: rgb(0, 13, 90);">CARS 4</div>
        <div class="card" style="background-color: rgb(2, 148, 43);">CARS 5</div>
        <div class="card" style="background-color: rgb(203, 8, 224);">CARS 6</div>
        <div class="card" style="background-color: rgb(236, 249, 1);">CARS 7</div>

    </div>
</body>
</html>
